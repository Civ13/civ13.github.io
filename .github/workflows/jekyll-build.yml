name: Build Jekyll site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: jekyll-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Ruby and install dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.7.2'
          bundler-cache: true
      - name: Validate local-theme dependency boundary
        run: bundle exec ruby tools/check_build_contract.rb
      - name: Build site
        run: bundle exec jekyll build
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate Persistence join shortcut
        run: |
          python3 tools/test_persistence_join.py
          python3 tools/test_persistence_join.py _site
      - name: Check static community calendar contracts
        run: |
          node tools/calendar/build.cjs --check
          node --test tools/test_calendar.cjs
          node --test tools/test_discord_calendar.cjs
          python3 -m unittest discover -s tools -p 'test_calendar_html.py'
          python3 tools/check_calendar.py _site
      - name: Check unpublished map browser prototype
        run: |
          node tools/map-explorer/build.cjs --check
          node --test tools/map-explorer/test.cjs
          test ! -e _site/tools/map-explorer/index.html
      - name: Validate roadmap and simulate updates and failures
        run: |
          node --test tools/test_roadmap.cjs
          node tools/check_roadmap.cjs _site
      - name: Check player help and inactive monitoring contracts
        run: |
          node --test tools/test_player_help.cjs tools/test_monitoring.cjs
          node tools/monitoring/check.cjs
      - name: Validate generated previews and fallback metadata
        run: |
          python3 tools/check_site_previews.py _site
          python3 tools/check_player_help.py _site
      - name: Validate architecture atlas and preserved downloads
        run: python3 tools/check_architecture_atlas.py _site
      - name: Exercise serialization, invalid payloads, and alternate origins
        env:
          CIV13_PREVIEW_FIXTURE_OUTPUT: ${{ runner.temp }}/calendar-preview
        run: python3 tools/test_previews.py
      - name: Upload validated site
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.event.pull_request.head.sha || github.sha }}
          path: _site
          retention-days: 7
      - name: Upload synthetic preview for inspection
        uses: actions/upload-artifact@v7
        with:
          name: calendar-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/calendar-preview
          if-no-files-found: error
          retention-days: 7
