name: Validate public services Worker
on:
  pull_request:
    branches: [master]
    paths: ['workers/public-services/**', '.github/workflows/public-services.yml']
  push:
    branches: [master]
    paths: ['workers/public-services/**', '.github/workflows/public-services.yml']
permissions:
  contents: read
concurrency:
  group: public-services-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/public-services
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/public-services/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - uses: actions/upload-artifact@v7
        with:
          name: public-services-${{ github.event.pull_request.head.sha || github.sha }}
          path: workers/public-services/dist
          retention-days: 7
