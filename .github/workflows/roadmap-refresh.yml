name: Refresh roadmap progress
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [roadmap-progress]
permissions:
  contents: write
  pages: write
concurrency:
  group: roadmap-progress
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify progress contracts
        run: node --test tools/test_roadmap.cjs
      - name: Refresh curated evidence atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/refresh_roadmap.cjs
      - name: Save successful update and rebuild existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/roadmap.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/roadmap.json
          git commit -m 'Refresh reviewed roadmap progress'
          git push origin HEAD:master
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
